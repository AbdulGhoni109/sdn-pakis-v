<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 20px; font-weight: 800; fill: #1B4F72; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748B; }
      .step-num { font-size: 14px; font-weight: 800; fill: #FFFFFF; }
      .step-title { font-size: 13px; font-weight: 700; fill: #0F172A; }
      .step-desc { font-size: 11px; font-weight: 500; fill: #475569; }
      .badge-text { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" rx="20" fill="#F8FAFC"/>
  <rect x="15" y="15" width="870" height="450" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header Banner -->
  <rect x="40" y="34" width="180" height="26" rx="13" fill="#FEF9EC"/>
  <text x="130" y="51" text-anchor="middle" class="badge-text" fill="#B45309">ALUR KERJA NYATA</text>
  <text x="40" y="84" class="title">Kronologi Pembuatan Proyek: Dari Nol Hingga Online</text>
  <text x="40" y="104" class="subtitle">Urutan langkah nyata apa dulu yang dikerjakan hingga website dan media AR selesai</text>

  <!-- Line Separator -->
  <line x1="40" y1="120" x2="860" y2="120" stroke="#F1F5F9" stroke-width="2"/>

  <!-- BARIS 1: LANGKAH 1, 2, 3 -->

  <!-- STEP 1 -->
  <g transform="translate(40, 138)">
    <rect width="248" height="135" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#1B4F72"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">1</text>
    <text x="54" y="26" class="step-title">Riset Konten &amp; Kurikulum</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#0284C7">Fase Perencanaan</text>
    <text x="16" y="68" class="step-desc">Kumpulkan profil SDN Pakis V,</text>
    <text x="16" y="84" class="step-desc">susun makna 5 sila Pancasila,</text>
    <text x="16" y="100" class="step-desc">filosofi 17-8-1945 &amp; 4 soal kuis.</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 298 205 L 334 205 M 326 199 L 334 205 L 326 211" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 2 -->
  <g transform="translate(344, 138)">
    <rect width="248" height="135" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#0284C7"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">2</text>
    <text x="54" y="26" class="step-title">Fondasi Web &amp; Tampilan</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#0284C7">Fase Kerangka Web</text>
    <text x="16" y="68" class="step-desc">Inisiasi Vite + React + Tailwind.</text>
    <text x="16" y="84" class="step-desc">Bikin halaman Profil, Visi Misi,</text>
    <text x="16" y="100" class="step-desc">Guru, Fasilitas, Berita &amp; Footer.</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 602 205 L 638 205 M 630 199 L 638 205 L 630 211" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 3 -->
  <g transform="translate(648, 138)">
    <rect width="212" height="135" rx="12" fill="#FEF9EC" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#D4921A"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">3</text>
    <text x="54" y="26" class="step-title">Aset 3D Garuda</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#D97706">Fase Desain 3D</text>
    <text x="16" y="68" class="step-desc">Pahat patung 3D Garuda,</text>
    <text x="16" y="84" class="step-desc">kompresi ke file .GLB (~580KB)</text>
    <text x="16" y="100" class="step-desc">&amp; gambar transparan PNG.</text>
  </g>

  <!-- CONNECTING TURN ARROW (ROW 1 TO ROW 2) -->
  <path d="M 754 283 L 754 300 Q 754 310 744 310 L 710 310" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-dasharray="4 4"/>

  <!-- BARIS 2: LANGKAH 4, 5, 6 -->

  <!-- STEP 4 -->
  <g transform="translate(40, 310)">
    <rect width="248" height="135" rx="12" fill="#FBF7FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#7C3AED"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">4</text>
    <text x="54" y="26" class="step-title">Rakit 4 Fitur Media AR</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#7C3AED">Fase Inti Interaktif</text>
    <text x="16" y="68" class="step-desc">Program: 1) 3D &amp; Suara Narasi,</text>
    <text x="16" y="84" class="step-desc">2) Kamera WebAR &amp; Jepret Foto,</text>
    <text x="16" y="100" class="step-desc">3) Native AR Lantai, 4) Kuis Nilai.</text>
  </g>

  <!-- ARROW 4 -> 5 -->
  <path d="M 298 377 L 334 377 M 326 371 L 334 377 L 326 383" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 5 -->
  <g transform="translate(344, 310)">
    <rect width="248" height="135" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#059669"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">5</text>
    <text x="54" y="26" class="step-title">Uji Coba di HP &amp; Laptop</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#059669">Fase Pengujian (Testing)</text>
    <text x="16" y="68" class="step-desc">Tes di berbagai smartphone (HP</text>
    <text x="16" y="84" class="step-desc">Android &amp; iPhone). Cek kamera,</text>
    <text x="16" y="100" class="step-desc">suara, dan warna kontras tombol.</text>
  </g>

  <!-- ARROW 5 -> 6 -->
  <path d="M 602 377 L 638 377 M 630 371 L 638 377 L 630 383" stroke="#94A3B8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- STEP 6 -->
  <g transform="translate(648, 310)">
    <rect width="212" height="135" rx="12" fill="#EBF2F8" stroke="#BAE0FD" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="16" fill="#1B4F72"/>
    <text x="28" y="33" text-anchor="middle" class="step-num">6</text>
    <text x="54" y="26" class="step-title">Peluncuran Online</text>
    <text x="54" y="40" font-size="10px" font-weight="600" fill="#1B4F72">Fase Rilis (Deploy)</text>
    <text x="16" y="68" class="step-desc">Simpan kode ke GitHub,</text>
    <text x="16" y="84" class="step-desc">siarkan gratis lewat Netlify</text>
    <text x="16" y="100" class="step-desc">beralamat resmi HTTPS.</text>
  </g>

</svg>
