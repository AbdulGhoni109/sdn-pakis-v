<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-size: 20px; font-weight: 800; fill: #1B4F72; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748B; }
      .mode-title { font-size: 15px; font-weight: 700; }
      .sub-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      .content-text { font-size: 12px; font-weight: 500; fill: #334155; line-height: 1.5; }
      .badge-text { font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
    </style>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="480" rx="20" fill="#F8FAFC"/>
  <rect x="15" y="15" width="870" height="450" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Header Banner -->
  <rect x="40" y="34" width="170" height="26" rx="13" fill="#ECFDF5"/>
  <text x="125" y="51" text-anchor="middle" class="badge-text" fill="#065F46">4 MODE INTERAKTIF</text>
  <text x="40" y="84" class="title">Cara Kerja Teknis 4 Fitur Media Pembelajaran AR</text>
  <text x="40" y="104" class="subtitle">Bagaimana sistem memproses data di balik layar dan pengalaman yang didapatkan siswa</text>

  <!-- Line Separator -->
  <line x1="40" y1="120" x2="860" y2="120" stroke="#F1F5F9" stroke-width="2"/>

  <!-- 4 PANELS GRID (2x2) -->

  <!-- PANEL 1: EKSPLORASI 3D & AUDIO (EMAS) -->
  <g transform="translate(40, 138)">
    <rect width="395" height="145" rx="14" fill="#FEF9EC" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#D4921A"/>
    <text x="30" y="35" text-anchor="middle" font-size="16" fill="#FFFFFF">🦅</text>
    <text x="56" y="27" class="mode-title" fill="#92400E">Mode 1: Eksplorasi 3D &amp; Suara</text>
    <text x="56" y="42" font-size="11px" font-weight="600" fill="#D97706">Patung digital bervolume 360° + narator suara</text>

    <!-- Di Balik Layar -->
    <text x="14" y="70" class="sub-header" fill="#B45309">⚙️ Di Balik Layar:</text>
    <text x="14" y="86" class="content-text">Three.js memuat berkas .GLB (~580KB) dan merender 3D.</text>
    <text x="14" y="102" class="content-text">Tombol speaker memanggil Web Speech API bahasa Indonesia.</text>

    <!-- Pengalaman Siswa -->
    <text x="14" y="124" class="content-text">👉 <tspan font-weight="700">Siswa:</tspan> Memutar patung &amp; mendengarkan suara makna 5 sila.</text>
  </g>

  <!-- PANEL 2: KAMERA WEBAR INTERAKTIF (UNGU) -->
  <g transform="translate(465, 138)">
    <rect width="395" height="145" rx="14" fill="#FBF7FF" stroke="#E9D5FF" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#7C3AED"/>
    <text x="30" y="35" text-anchor="middle" font-size="16" fill="#FFFFFF">📷</text>
    <text x="56" y="27" class="mode-title" fill="#6B21A8">Mode 2: Kamera WebAR di Meja</text>
    <text x="56" y="42" font-size="11px" font-weight="600" fill="#9333EA">Kamera HP/laptop + manipulasi lambang</text>

    <!-- Di Balik Layar -->
    <text x="14" y="70" class="sub-header" fill="#7C3AED">⚙️ Di Balik Layar:</text>
    <text x="14" y="86" class="content-text">Browser minta izin kamera (getUserMedia) secara privat.</text>
    <text x="14" y="102" class="content-text">Canvas API menggabungkan video + gambar lambang jadi foto.</text>

    <!-- Pengalaman Siswa -->
    <text x="14" y="124" class="content-text">👉 <tspan font-weight="700">Siswa:</tspan> Geser lambang ke meja belajar &amp; foto bersama.</text>
  </g>

  <!-- PANEL 3: 3D NYATA DI RUANGAN (BIRU) -->
  <g transform="translate(40, 300)">
    <rect width="395" height="145" rx="14" fill="#F0F7FD" stroke="#BAE0FD" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#1B4F72"/>
    <text x="30" y="35" text-anchor="middle" font-size="16" fill="#FFFFFF">📱</text>
    <text x="56" y="27" class="mode-title" fill="#1B4F72">Mode 3: 3D Nyata di Ruangan (Native AR)</text>
    <text x="56" y="42" font-size="11px" font-weight="600" fill="#0284C7">Patung AR berdiri di lantai/meja kelas</text>

    <!-- Di Balik Layar -->
    <text x="14" y="70" class="sub-header" fill="#0284C7">⚙️ Di Balik Layar:</text>
    <text x="14" y="86" class="content-text">Google Model-Viewer memicu sensor ARCore/QuickLook HP.</text>
    <text x="14" y="102" class="content-text">Sensor memindai permukaan lantai datar secara akurat.</text>

    <!-- Pengalaman Siswa -->
    <text x="14" y="124" class="content-text">👉 <tspan font-weight="700">Siswa:</tspan> Berjalan mengelilingi patung Garuda di lantai kelas.</text>
  </g>

  <!-- PANEL 4: KUIS PANCASILA (HIJAU) -->
  <g transform="translate(465, 300)">
    <rect width="395" height="145" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#059669"/>
    <text x="30" y="35" text-anchor="middle" font-size="16" fill="#FFFFFF">📝</text>
    <text x="56" y="27" class="mode-title" fill="#065F46">Mode 4: Kuis Pendidikan Pancasila</text>
    <text x="56" y="42" font-size="11px" font-weight="600" fill="#059669">Evaluasi mandiri interaktif seketika</text>

    <!-- Di Balik Layar -->
    <text x="14" y="70" class="sub-header" fill="#059669">⚙️ Di Balik Layar:</text>
    <text x="14" y="86" class="content-text">React State memvalidasi kunci jawaban saat tombol diklik.</text>
    <text x="14" y="102" class="content-text">Kotak pembahasan guru dibuka &amp; skor akhir dikalkulasi.</text>

    <!-- Pengalaman Siswa -->
    <text x="14" y="124" class="content-text">👉 <tspan font-weight="700">Siswa:</tspan> Dapat nilai instan &amp; penjelasan materi dari guru.</text>
  </g>

</svg>
